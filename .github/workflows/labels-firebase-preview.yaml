name: (labels) Firebase preview

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
    paths:
      - 'labels/**'

jobs:
  build_and_deploy_preview:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      checks: write
      pull-requests: write
    defaults:
      run:
        working-directory: ./labels

    strategy:
      matrix:
        node: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: ./labels/package-lock.json

      - run: npm ci

      - run: npm run build:dev
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: firebase-preview
        with:
          firebaseToolsVersion: "12.9.1"
          firebaseServiceAccount: "${{ secrets.MD_EXTS_FIREBASE_SA_DEV }}"
          projectId: frontend-extensions-develop
          target: emporix-labels-develop
          expires: 5d
          repoToken: "${{ secrets.GITHUB_TOKEN }}"

      - name: Deploy labels preview to the shared Hosting site
        id: shared-preview
        uses: ./.github/actions/deploy-remote
        with:
          service-account: ${{ secrets.MD_EXTS_FIREBASE_SA_DEV }}
          site: emporix-md-extensions-develop
          remote: labels
          mode: dev
          channel: pr-${{ github.event.number }}-labels

      - name: Comment the shared preview URL
        run: |
          gh pr comment "$PR_NUMBER" --body "labels preview: $PREVIEW_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          PREVIEW_URL: ${{ steps.shared-preview.outputs.url }}
