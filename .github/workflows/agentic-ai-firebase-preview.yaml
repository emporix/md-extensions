name: (agentic-ai) Firebase preview

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
    paths:
      - 'agentic-ai/**'

concurrency:
  group: agentic-ai-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  extension_preview:
    name: Deploy agentic-ai extension preview
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [20.x]

    defaults:
      run:
        working-directory: ./agentic-ai

    outputs:
      preview_url: ${{ steps.firebase-preview.outputs.details_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'
          cache-dependency-path: ./agentic-ai/yarn.lock

      - run: yarn install

      - run: yarn build:dev
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: firebase-preview
        with:
          firebaseToolsVersion: "12.9.1"
          firebaseServiceAccount: "${{ secrets.MD_EXTS_FIREBASE_SA_DEV }}"
          projectId: frontend-extensions-develop
          target: emporix-agentic-ai-develop
          expires: 5d
          repoToken: "${{ secrets.GITHUB_TOKEN }}"

  md_preview:
    name: Deploy management-dashboard preview
    needs: extension_preview
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [20.x]

    steps:
      # management-dashboard's own firebase.json has no target for our site - borrow this repo's
      - name: Checkout agentic-ai extension hosting config
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            firebase.json
            .firebaserc
          sparse-checkout-cone-mode: false

      - name: Checkout management-dashboard
        uses: actions/checkout@v4
        with:
          repository: emporix/management-dashboard
          ref: master
          token: ${{ secrets.MD_EXT_GH_TOKEN }}
          persist-credentials: false
          path: md

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: md/package-lock.json

      - name: Build management-dashboard against agentic-ai extension preview
        working-directory: md
        env:
          VITE_AI_AGENTS_URL: "${{ needs.extension_preview.outputs.preview_url }}/assets/remoteEntry.js?v=3"
        run: |
          npm ci
          npm run build:dev

      # so the deploy below targets our site instead of management-dashboard-develop
      - name: Move management-dashboard build into place
        run: |
          mkdir -p agentic-ai
          mv md/dist agentic-ai/dist

      - name: Deploy management-dashboard preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseToolsVersion: "12.9.1"
          firebaseServiceAccount: "${{ secrets.MD_EXTS_FIREBASE_SA_DEV }}"
          projectId: frontend-extensions-develop
          target: emporix-agentic-ai-develop
          channelId: "md-ext-${{ github.event.pull_request.number }}"
          expires: 5d
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
