name: (customers) Build and deploy (dev, stage) to Firebase
on:
  push:
    branches:
      - master
    paths:
      - 'customers/**'
      - 'audit-log/**'

jobs:
  build_and_deploy:
    runs-on: ubuntu-26.04
    # Queue overlapping runs so an older build cannot finish after a newer one.
    concurrency:
      group: customers-firebase-dev-stage
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ./customers

    strategy:
      matrix:
        node: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: ./customers/package-lock.json

      - run: npm ci

      # Type-check and CORS check; the deploy action builds again for the shared site.
      - run: npm run build:dev

      - name: Deploy customers to the shared Hosting site (dev)
        uses: ./.github/actions/deploy-remote
        with:
          service-account: ${{ secrets.MD_EXTS_FIREBASE_SA_DEV }}
          site: frontend-extensions-develop
          remote: customers
          mode: dev

      - name: Deploy customers to the shared Hosting site (stage)
        uses: ./.github/actions/deploy-remote
        with:
          service-account: ${{ secrets.MD_EXTS_FIREBASE_SA_STAGE }}
          site: frontend-extensions-stage
          remote: customers
          mode: stage
