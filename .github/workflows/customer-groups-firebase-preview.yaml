name: (customer-groups) Firebase preview

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
    paths:
      - 'customer-groups/**'
      - 'audit-log/**'

jobs:
  build_and_deploy_preview:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ./customer-groups

    strategy:
      matrix:
        node: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: ./customer-groups/package-lock.json

      - run: npm ci

      # Type-check; the deploy action builds again for the shared site.
      - run: npm run build:dev

      - name: Deploy customer-groups preview to the shared Hosting site
        id: shared-preview
        uses: ./.github/actions/deploy-remote
        with:
          service-account: ${{ secrets.MD_EXTS_FIREBASE_SA_DEV }}
          site: frontend-extensions-develop
          remote: customer-groups
          mode: dev
          channel: pr-${{ github.event.number }}-customer-groups

      - name: Comment the preview URL
        run: |
          gh pr comment "$PR_NUMBER" --body "customer-groups preview: $PREVIEW_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          PREVIEW_URL: ${{ steps.shared-preview.outputs.url }}
