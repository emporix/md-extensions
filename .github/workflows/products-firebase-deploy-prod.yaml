name: (products) Build and deploy (prod) to Firebase

on:
  push:
    tags:
      - products-*
    paths:
      - 'products/**'
  workflow_dispatch:
    inputs:
      tag:
        description: "Deploy the tag."
        required: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-26.04
    # Queue overlapping runs so an older build cannot finish after a newer one.
    concurrency:
      group: products-firebase-prod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ./products

    strategy:
      matrix:
        node: [20.x]

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch supplies inputs.tag; tag pushes use github.ref
          ref: ${{ github.event.inputs.tag || github.ref }}

      # workflow_dispatch can deploy an older tag whose deploy action or script differs,
      # or has none, so take the tooling from the ref this workflow runs from. It sits
      # outside products/ and audit-log/, the only folders the build and deploy read
      # (both come from the tag checkout above).
      - name: Checkout deploy tooling
        uses: actions/checkout@v4
        with:
          path: .deploy-tooling
          sparse-checkout: .github

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: ./products/package-lock.json

      - run: npm ci

      # Type-check and CORS check; the deploy action builds again for the shared site.
      - run: npm run build:prod

      - name: Deploy products to the shared Hosting site
        uses: ./.deploy-tooling/.github/actions/deploy-remote
        with:
          service-account: ${{ secrets.MD_EXTS_FIREBASE_SA }}
          site: frontend-extensions
          remote: products
          mode: prod
