name: (products) Build and deploy (dev, stage) to Firebase
on:
  push:
    branches:
      - master
    paths:
      - 'products/**'
      - 'audit-log/**'

jobs:
  build_and_deploy:
    runs-on: ubuntu-26.04
    # Queue overlapping runs so an older build cannot finish after a newer one.
    concurrency:
      group: products-firebase-dev-stage
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ./products

    strategy:
      matrix:
        node: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: ./products/package-lock.json

      - run: npm ci

      # Old per-remote sites (dev, then stage); removed in COP-7348 stage D, once the
      # host loads products from the shared site in production. Both run before any
      # shared-site step, so a failing shared deploy cannot skip an old deploy.
      - run: npm run build:dev
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: firebase-hosting-deploy-dev
        with:
          firebaseToolsVersion: "12.9.1"
          firebaseServiceAccount: "${{ secrets.MD_EXTS_FIREBASE_SA_DEV }}"
          projectId: frontend-extensions-develop
          channelId: live
          target: emporix-products-develop

      - run: npm run build:stage
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: firebase-hosting-deploy-stage
        with:
          firebaseToolsVersion: "12.9.1"
          firebaseServiceAccount: "${{ secrets.MD_EXTS_FIREBASE_SA_STAGE }}"
          projectId: frontend-extensions-stage
          channelId: live
          target: emporix-products-stage

      # The deploy action rebuilds dist/ flat for the shared site, so it runs last.
      - name: Deploy products to the shared Hosting site (dev)
        uses: ./.github/actions/deploy-remote
        with:
          service-account: ${{ secrets.MD_EXTS_FIREBASE_SA_DEV }}
          site: frontend-extensions-develop
          remote: products
          mode: dev

      - name: Deploy products to the shared Hosting site (stage)
        uses: ./.github/actions/deploy-remote
        with:
          service-account: ${{ secrets.MD_EXTS_FIREBASE_SA_STAGE }}
          site: frontend-extensions-stage
          remote: products
          mode: stage
