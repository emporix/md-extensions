name: (categories) Firebase preview

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - 'categories/**'

jobs:
  build_and_deploy_preview:
    runs-on: ubuntu-26.04
    # pull-requests: the shared-site step comments the preview URL on the PR.
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ./categories

    strategy:
      matrix:
        node: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: ./categories/package-lock.json

      - run: npm ci

      # Type-check and CORS check; the deploy action builds again for the shared site.
      - run: npm run build:dev

      - name: Deploy categories preview to the shared Hosting site
        id: shared-preview
        uses: ./.github/actions/deploy-remote
        with:
          service-account: ${{ secrets.MD_EXTS_FIREBASE_SA_DEV }}
          site: frontend-extensions-develop
          remote: categories
          mode: dev
          channel: pr-${{ github.event.number }}-categories

      # One comment per PR: update the bot's earlier "categories preview:" comment
      # instead of adding a new one on every push.
      - name: Comment the preview URL
        run: |
          BODY="categories preview: $PREVIEW_URL"
          COMMENT_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("categories preview:"))) | .id' | tail -n 1)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -f body="$BODY" > /dev/null
          else
            gh pr comment "$PR_NUMBER" --body "$BODY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          PREVIEW_URL: ${{ steps.shared-preview.outputs.url }}
