name: (returns) Build and deploy (prod) to Firebase

on:
  push:
    tags:
      - returns-*
    paths:
      - 'returns/**'
  workflow_dispatch:
    inputs:
      tag:
        description: "Deploy the tag."
        required: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./returns

    strategy:
      matrix:
        node: [20.x]

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch supplies inputs.tag; tag pushes use github.ref
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: ./returns/package-lock.json

      - run: npm ci

      - run: npm run build:prod
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: firebase-hosting-deploy
        with:
          firebaseToolsVersion: "12.9.1"
          firebaseServiceAccount: "${{ secrets.MD_EXTS_FIREBASE_SA }}"
          projectId: frontend-extensions
          channelId: live
          target: emporix-returns
