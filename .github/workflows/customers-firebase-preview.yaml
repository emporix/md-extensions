name: (customers) Firebase preview

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
    paths:
      - 'customers/**'
      - 'audit-log/**'

jobs:
  build_and_deploy_preview:
    runs-on: ubuntu-26.04
    # pull-requests and checks: the old action-hosting-deploy step comments the preview URL
    # and opens a check run; the shared-site step comments its own URL.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    defaults:
      run:
        working-directory: ./customers

    strategy:
      matrix:
        node: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: ./customers/package-lock.json

      - run: npm ci

      - run: npm run build:dev

      # Old per-remote site; removed in COP-7348 stage D, once the host loads customers
      # from the shared site in production. It runs first and publishes the regular dist/.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: firebase-preview
        with:
          firebaseToolsVersion: "12.9.1"
          firebaseServiceAccount: "${{ secrets.MD_EXTS_FIREBASE_SA_DEV }}"
          projectId: frontend-extensions-develop
          target: emporix-customers-develop
          expires: 5d
          repoToken: "${{ secrets.GITHUB_TOKEN }}"

      # The deploy action rebuilds dist/ flat for the shared site, so it runs last.
      - name: Deploy customers preview to the shared Hosting site
        id: shared-preview
        uses: ./.github/actions/deploy-remote
        with:
          service-account: ${{ secrets.MD_EXTS_FIREBASE_SA_DEV }}
          site: frontend-extensions-develop
          remote: customers
          mode: dev
          channel: pr-${{ github.event.number }}-customers

      - name: Comment the preview URL
        run: |
          gh pr comment "$PR_NUMBER" --body "customers preview: $PREVIEW_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          PREVIEW_URL: ${{ steps.shared-preview.outputs.url }}
