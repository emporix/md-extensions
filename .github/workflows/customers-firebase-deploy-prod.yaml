name: (customers) Build and deploy (prod) to Firebase

on:
  push:
    tags:
      - customers-*
    paths:
      - 'customers/**'
  workflow_dispatch:
    inputs:
      tag:
        description: "Deploy the tag."
        required: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-26.04
    # Queue overlapping runs so an older build cannot finish after a newer one.
    concurrency:
      group: customers-firebase-prod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ./customers

    strategy:
      matrix:
        node: [20.x]

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch supplies inputs.tag; tag pushes use github.ref
          ref: ${{ github.event.inputs.tag || github.ref }}

      # workflow_dispatch can deploy an older tag whose deploy action or script differs,
      # or has none, so take the tooling from the ref this workflow runs from. It sits
      # outside customers/ and audit-log/, the only folders the build and deploy read
      # (both come from the tag checkout above).
      - name: Checkout deploy tooling
        uses: actions/checkout@v4
        with:
          path: .deploy-tooling
          sparse-checkout: .github

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: ./customers/package-lock.json

      - run: npm ci

      # Old per-remote site; removed in COP-7348 stage D, once the host loads customers
      # from the shared site in production. It runs first and publishes the regular dist/.
      - run: npm run build:prod
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: firebase-hosting-deploy
        with:
          firebaseToolsVersion: "12.9.1"
          firebaseServiceAccount: "${{ secrets.MD_EXTS_FIREBASE_SA }}"
          projectId: frontend-extensions
          channelId: live
          target: emporix-customers

      # The deploy action rebuilds dist/ flat for the shared site, so it runs last.
      - name: Deploy customers to the shared Hosting site
        uses: ./.deploy-tooling/.github/actions/deploy-remote
        with:
          service-account: ${{ secrets.MD_EXTS_FIREBASE_SA }}
          site: frontend-extensions
          remote: customers
          mode: prod
