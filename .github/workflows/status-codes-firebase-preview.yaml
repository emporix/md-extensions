name: (status-codes) Firebase preview

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
    paths:
      - 'status-codes/**'

jobs:
  build_and_deploy_preview:
    runs-on: ubuntu-26.04
    # pull-requests and checks: the old action-hosting-deploy step comments the preview URL
    # and opens a check run; the shared-site step comments its own URL.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    defaults:
      run:
        working-directory: ./status-codes

    strategy:
      matrix:
        node: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: ./status-codes/package-lock.json

      - run: npm ci

      - run: npm run build:dev
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: firebase-preview
        with:
          firebaseToolsVersion: "12.9.1"
          firebaseServiceAccount: "${{ secrets.MD_EXTS_FIREBASE_SA_DEV }}"
          projectId: frontend-extensions-develop
          target: emporix-status-codes-develop
          expires: 5d
          repoToken: "${{ secrets.GITHUB_TOKEN }}"

      # The old site stays until the host loads status-codes from the shared site in prod
      # (COP-7446 phase D). The deploy action rebuilds dist for /status-codes/, so it runs last.
      - name: Deploy status-codes preview to the shared Hosting site
        id: shared-preview
        uses: ./.github/actions/deploy-remote
        with:
          service-account: ${{ secrets.MD_EXTS_FIREBASE_SA_DEV }}
          site: frontend-extensions-develop
          remote: status-codes
          mode: dev
          channel: pr-${{ github.event.number }}-status-codes

      - name: Comment the preview URL
        run: |
          gh pr comment "$PR_NUMBER" --body "status-codes preview: $PREVIEW_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          PREVIEW_URL: ${{ steps.shared-preview.outputs.url }}
