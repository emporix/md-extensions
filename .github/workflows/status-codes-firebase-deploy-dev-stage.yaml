name: (status-codes) Build and deploy (dev, stage) to Firebase
on:
  push:
    branches:
      - master
    paths:
      - 'status-codes/**'

jobs:
  build_and_deploy:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ./status-codes

    strategy:
      matrix:
        node: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: ./status-codes/package-lock.json

      - run: npm ci

      - run: npm run build:dev
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: firebase-hosting-deploy-dev
        with:
          firebaseToolsVersion: "12.9.1"
          firebaseServiceAccount: "${{ secrets.MD_EXTS_FIREBASE_SA_DEV }}"
          projectId: frontend-extensions-develop
          channelId: live
          target: emporix-status-codes-develop

      - run: npm run build:stage
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: firebase-hosting-deploy-stage
        with:
          firebaseToolsVersion: "12.9.1"
          firebaseServiceAccount: "${{ secrets.MD_EXTS_FIREBASE_SA_STAGE }}"
          projectId: frontend-extensions-stage
          channelId: live
          target: emporix-status-codes-stage

      # The old sites above stay until the host loads status-codes from the shared site in
      # prod (COP-7446 phase D). The deploy action rebuilds dist for /status-codes/, so it
      # runs after every old deploy.
      - name: Deploy status-codes to the shared Hosting site (dev)
        uses: ./.github/actions/deploy-remote
        with:
          service-account: ${{ secrets.MD_EXTS_FIREBASE_SA_DEV }}
          site: frontend-extensions-develop
          remote: status-codes
          mode: dev

      - name: Deploy status-codes to the shared Hosting site (stage)
        uses: ./.github/actions/deploy-remote
        with:
          service-account: ${{ secrets.MD_EXTS_FIREBASE_SA_STAGE }}
          site: frontend-extensions-stage
          remote: status-codes
          mode: stage
