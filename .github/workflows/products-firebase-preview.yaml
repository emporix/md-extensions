name: (products) Firebase preview

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - 'products/**'
      - 'audit-log/**'

jobs:
  build_and_deploy_preview:
    runs-on: ubuntu-26.04
    # pull-requests and checks: the old action-hosting-deploy step comments the preview URL
    # and opens a check run; the shared-site step comments its own URL.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    defaults:
      run:
        working-directory: ./products

    strategy:
      matrix:
        node: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: ./products/package-lock.json

      - run: npm ci

      - run: npm run build:dev

      # Old per-remote site; removed in COP-7348 stage D, once the host loads products
      # from the shared site in production. It runs first and publishes the regular dist/.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: firebase-preview
        with:
          firebaseToolsVersion: "12.9.1"
          firebaseServiceAccount: "${{ secrets.MD_EXTS_FIREBASE_SA_DEV }}"
          projectId: frontend-extensions-develop
          target: emporix-products-develop
          expires: 5d
          repoToken: "${{ secrets.GITHUB_TOKEN }}"

      # The deploy action rebuilds dist/ flat for the shared site, so it runs last.
      - name: Deploy products preview to the shared Hosting site
        id: shared-preview
        uses: ./.github/actions/deploy-remote
        with:
          service-account: ${{ secrets.MD_EXTS_FIREBASE_SA_DEV }}
          site: frontend-extensions-develop
          remote: products
          mode: dev
          channel: pr-${{ github.event.number }}-products

      # One comment per PR: update the bot's earlier "products preview:" comment
      # instead of adding a new one on every push.
      - name: Comment the preview URL
        run: |
          BODY="products preview: $PREVIEW_URL"
          COMMENT_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("products preview:"))) | .id' | tail -n 1)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -f body="$BODY" > /dev/null
          else
            gh pr comment "$PR_NUMBER" --body "$BODY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          PREVIEW_URL: ${{ steps.shared-preview.outputs.url }}
