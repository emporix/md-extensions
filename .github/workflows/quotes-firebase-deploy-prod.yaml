name: (quotes) Build and deploy (prod) to Firebase

on:
  push:
    tags:
      - quotes-*
    paths:
      - 'quotes/**'
  workflow_dispatch:
    inputs:
      tag:
        description: "Deploy the tag."
        required: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ./quotes

    strategy:
      matrix:
        node: [20.x]

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch supplies inputs.tag; tag pushes use github.ref
          ref: ${{ github.event.inputs.tag || github.ref }}

      # workflow_dispatch can deploy an older tag whose deploy action or script differs,
      # so take the tooling from the ref this workflow runs from. It sits outside
      # quotes/ and audit-log/, the only folders the build and deploy read (both come
      # from the tag checkout above).
      - name: Checkout deploy tooling
        uses: actions/checkout@v4
        with:
          path: .deploy-tooling
          sparse-checkout: .github

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: ./quotes/package-lock.json

      - run: npm ci

      # Type-check and CORS check; the deploy action builds again for the shared site.
      - run: npm run build:prod

      - name: Deploy quotes to the shared Hosting site
        uses: ./.deploy-tooling/.github/actions/deploy-remote
        with:
          service-account: ${{ secrets.MD_EXTS_FIREBASE_SA }}
          site: frontend-extensions
          remote: quotes
          mode: prod
