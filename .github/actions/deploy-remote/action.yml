name: Deploy remote to shared Hosting site
description: Publish a built remote into its folder of the shared Firebase Hosting site.

inputs:
  service-account:
    description: Google service account key JSON
    required: true
  site:
    description: Firebase Hosting site id
    required: true
  remote:
    description: Remote folder name, also the folder slug on the site
    required: true
  channel:
    description: Preview channel id; leave empty to deploy to the live channel
    required: false
    default: ''
  ttl:
    description: Preview channel time to live, used only with channel
    required: false
    default: 432000s

outputs:
  url:
    description: URL of the deployed remote folder
    value: ${{ steps.deploy.outputs.url }}

runs:
  using: composite
  steps:
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ inputs.service-account }}
        token_format: access_token
        access_token_scopes: https://www.googleapis.com/auth/cloud-platform

    - name: Deploy remote folder
      id: deploy
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        SITE: ${{ inputs.site }}
        REMOTE: ${{ inputs.remote }}
        CHANNEL: ${{ inputs.channel }}
        TTL: ${{ inputs.ttl }}
      run: |
        args=(--site "$SITE" --slug "$REMOTE" --dir "$REMOTE/dist")
        if [ -n "$CHANNEL" ]; then
          args+=(--channel "$CHANNEL" --ttl "$TTL")
        fi
        node .github/scripts/hosting/deploy-remote.mjs "${args[@]}"
